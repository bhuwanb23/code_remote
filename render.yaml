
services:
  - type: web
    name: opencode-render-agent
    runtime: node
    plan: free
    buildCommand: npm install && npm install --global opencode-ai
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REPO_URL
        sync: false
      - key: REPO_BRANCH
        value: main
      - key: OPENCODE_MODEL
        sync: false
      - key: OPENCODE_AUTH_JSON_BASE64
        sync: false
